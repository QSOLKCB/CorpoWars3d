name: Bonus game / Close Quarters (preview only)

on:
  pull_request:
    paths:
      - 'games/close-quarters/**'
      - 'src/**'
      - '.github/workflows/bonus-preview.yml'
  push:
    branches: [feature/afterzero-compact-bonus]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact:
    name: Deterministic game and portable bonus
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned, development-only Python runner
        run: python -m pip install uv==0.13.5
      - name: Verify original squad runtime
        run: |
          node --test tests/*.test.js
          node scripts/check.js
          node scripts/build.js
      - name: Verify transplanted maps, squad combat, chrono and saves
        run: node --test games/close-quarters/tests/*.test.js
      - name: Build exact import-closure previews twice
        run: |
          mkdir -p out
          uv run --no-project python games/close-quarters/tools/package.py --output out/bonus-a.zip
          uv run --no-project python games/close-quarters/tools/package.py --output out/bonus-b.zip
          cmp out/bonus-a.zip out/bonus-b.zip
          uv run --no-project python games/close-quarters/tools/package.py --verify out/bonus-a.zip
          sha256sum out/bonus-a.zip > out/SHA256SUMS.txt
      - name: Install pinned CI-only Chromium
        run: uvx --from playwright==1.56.0 playwright install --with-deps chromium
      - name: Extract preview ZIP and smoke-test shipped archive, not source checkout
        env:
          BONUS_SCREENSHOT_DIR: out
          BONUS_ROOT: out/unpacked/CORPOWARS-CLOSE-QUARTERS
        run: |
          uv run --no-project python -m zipfile -e out/bonus-a.zip out/unpacked
          uv run --no-project --with playwright==1.56.0 python games/close-quarters/tests/browser_smoke.py
      - name: Preview artifacts / NOT a release
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpowars-close-quarters-preview
          path: |
            out/bonus-a.zip
            out/SHA256SUMS.txt
            out/bonus-fps.png
            out/bonus-tactical.png
          if-no-files-found: ignore
          retention-days: 14
