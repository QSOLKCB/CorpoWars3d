[sdl]
fullscreen=false
output=surface
[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=normal
cputype=386
cycles=fixed 30000
[mixer]
rate=22050
blocksize=512
prebuffer=30
[sblaster]
sbtype=sb16
sbbase=220
irq=5
dma=1
hdma=5
oplmode=none
[speaker]
pcspeaker=true
[autoexec]
mount c .
c:
set BLASTER=A220 I5 D1 H5 T6
corpo.com
exit
